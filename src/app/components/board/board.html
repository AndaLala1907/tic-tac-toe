<div class="board" role="grid" aria-label="Tic Tac Toe board">
  @for (cell of board(); track $index) {
    <button
      type="button"
      class="cell"
      role="gridcell"
      [class.x]="cell === 'X'"
      [class.o]="cell === 'O'"
      [class.win]="isWinning($index)"
      [disabled]="disabled() || cell !== null"
      [attr.aria-label]="'Cell ' + ($index + 1) + (cell ? ': ' + cell : ': empty')"
      (click)="cellClick.emit($index)"
    >{{ cell }}</button>
  }
</div>
